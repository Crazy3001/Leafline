# Builds the website (the same pages and Rust as the program, run in the browser) and publishes it
# to GitHub Pages at crazy3001.github.io/Leafline. Run by hand from the Actions tab, normally
# alongside a program release. Nothing is published on a push.
name: Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm packages
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web

      # Must match the wasm-bindgen crate's version in crates/leafline-web/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      # SQLite is C: the runner's clang builds it for WebAssembly.
      - name: Point the C build at clang
        run: |
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(ls /usr/bin/llvm-ar* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
