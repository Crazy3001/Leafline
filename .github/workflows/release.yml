# Builds the Windows installers and puts them on a draft GitHub release.
#
# Push a tag such as v0.1.0 (it must match the version in tauri.conf.json), or run it by hand
# from the Actions tab. The release stays a draft until someone publishes it on GitHub, so
# nothing reaches players by accident. Leafline's update check reads the latest published
# release of this repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm packages
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      - name: Build and upload to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Leafline v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            An unofficial, read-only companion for MapleStory Classic World. Windows 10 and 11. What's new is in the [changelog](https://github.com/Crazy3001/Leafline/blob/main/CHANGELOG.md).

            Download the `-setup.exe` (or the `.msi`) below and run it. The installer isn't code-signed yet, so Windows SmartScreen may warn: choose **More info → Run anyway**.

            **Use it at your own risk.** Nexon has not said whether read-only overlays are allowed; the README explains what Leafline reads, what it never does, and the one reported ban. Leafline is not affiliated with or endorsed by Nexon.

            [Code signing policy](https://github.com/Crazy3001/Leafline#code-signing-policy)

      # A SHA-256 for each installer, as SHA256SUMS.txt on the release and at the end of its
      # notes, so a download can be checked against what this run built.
      - name: Add SHA-256 checksums to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: v${{ steps.tauri.outputs.appVersion }}
        run: |
          $files = @((ConvertFrom-Json $env:ARTIFACTS) | ForEach-Object { $_ } | Where-Object { $_ -match '\.(exe|msi)$' })
          if ($files.Count -eq 0) { throw "No installers among: $env:ARTIFACTS" }
          $lines = foreach ($file in $files) {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower(), (Split-Path $file -Leaf)
          }
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          [IO.File]::WriteAllLines($sums, [string[]]$lines)
          $release = "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          gh api --method POST -H 'Content-Type: text/plain' `
            "https://uploads.github.com/$release/assets?name=SHA256SUMS.txt" --input $sums | Out-Null
          if ($LASTEXITCODE) { throw 'Uploading SHA256SUMS.txt failed' }
          $body = (gh api $release --jq .body) -join "`n"
          $fence = '```'
          $check = 'To check a download, run `Get-FileHash <file>` in PowerShell and compare.'
          $notes = "$body`n`n### SHA-256`n$fence`n$($lines -join "`n")`n$fence`n$check"
          $patch = Join-Path $env:RUNNER_TEMP 'release-body.json'
          # The tag is sent with the notes and checked afterwards: v0.1.1's draft went out as
          # "untagged-...", which the update check can't read, and a published release is locked.
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+') { throw "No version to tag the release with: '$env:TAG'" }
          "Draft tag before the notes: $(gh api $release --jq .tag_name)"
          @{ body = $notes; tag_name = $env:TAG } | ConvertTo-Json | Set-Content -Encoding utf8 $patch
          gh api --method PATCH $release --input $patch | Out-Null
          if ($LASTEXITCODE) { throw 'Updating the release notes failed' }
          $tag = gh api $release --jq .tag_name
          if ($tag -ne $env:TAG) { throw "The draft's tag is '$tag', not '$env:TAG'. Don't publish it." }
          "Draft tag: $tag"
          $lines
