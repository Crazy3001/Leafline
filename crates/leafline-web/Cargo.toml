[package]
name = "leafline-web"
version = "0.4.0"
description = "Leafline's website: the shared code, run in the browser in a Web Worker"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leafline-core = { path = "../leafline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
# Must match the wasm-bindgen CLI that writes the JavaScript side (see package.json).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }
web-time = "1"
console_error_panic_hook = "0.1"
