# Leafline: the Windows program (src-tauri), the code it shares with the website (crates/leafline-core),
# and the website's two WebAssembly builds: its records worker (crates/leafline-web) and its game
# readers (crates/leafline-capture).
[workspace]
members = ["src-tauri", "crates/leafline-core", "crates/leafline-web", "crates/leafline-capture"]
resolver = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image processing is far too slow unoptimised; keep dependencies fast in dev builds, and the
# readers fast enough that a dev build keeps up with the game (unoptimised, a frame at UI Size
# Default took seconds).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The website's WebAssembly: built for download size, not speed. The program's release build is
# unchanged. wasm-bindgen needs the sections `strip` would remove.
[profile.web]
inherits = "release"
opt-level = "z"
strip = false

# The website's readers (crates/leafline-capture): they run on every frame, so they are built for
# speed. Only a page that reads a shared game window downloads them.
[profile.web-fast]
inherits = "release"
opt-level = 3
strip = false
