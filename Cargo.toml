# Leafline: the Windows program (src-tauri), the website's WebAssembly worker (crates/leafline-web)
# and the code they share (crates/leafline-core).
[workspace]
members = ["src-tauri", "crates/leafline-core"]
resolver = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image processing is far too slow unoptimised; keep dependencies fast in dev builds, and the
# readers fast enough that a dev build keeps up with the game (unoptimised, a frame at UI Size
# Default took seconds).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
